# Auto-generated by FM Switcher
bindd = $mainMod, E, File Manager, exec, uwsm-app -- $terminal -e $fileManager

# Auto-generated by Browser Switcher
bindd = $mainMod, W, Launch Browser, exec, uwsm-app -- $browser

# Auto-generated by Text Editor Switcher
bindd = $mainMod, R, Open Text Editor, exec, uwsm-app -- $terminal --class nvim -e $textEditor


# -- TERMINAL-CLIPBOARD-START --
unbind = $mainMod, V
bind = $mainMod, V, exec, ~/user_scripts/clipboard/close_terminal_clipboard.sh foot --app-id=terminal_clipboard.sh ~/user_scripts/clipboard/terminal_clipboard.sh
# -- TERMINAL-CLIPBOARD-END --

# [2026-05-13 09:16] SRC
unbind = $mainMod, C
bindd = $mainMod, Q, Close Window, killactive,


# [2026-05-13 09:20] CUST
bindd = bindd = $mainMod, RETURN, Launch Teminal, exec, uwsm-app -- kitty
